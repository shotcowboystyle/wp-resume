# Example GitHub Action: weekly SEO regression check for a WordPress marketing site.
#
# Not active here. To use it, copy this file to .github/workflows/ in the site's
# own (private) repository, copy tools/seo_watch.py alongside it, and uncomment
# the schedule.
#
# What it does: fetches every URL in the sitemap index (tools/seo_watch.py,
# Python standard library only, two requests at a time) and fails on non-200
# sitemap URLs, empty pages, noindex on a sitemap URL, and AggregateRating values
# that never appear in the visible text. It warns on missing or foreign
# canonicals, an Organization node without @id, and duplicate titles. A failing
# run opens (or comments on) one issue labelled seo-watch; a clean run closes it.
#
# Actions are pinned to commit SHAs. Nothing is downloaded or installed at run time.

name: SEO watch

on:
  # schedule:
  #   - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      url:
        description: Site to audit (its /sitemap_index.xml is read)
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-watch
  cancel-in-progress: false

env:
  # Set SITE_URL here once the schedule is on; scheduled runs have no inputs.
  SITE_URL: ${{ inputs.url }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sitemap checks
        id: watch
        continue-on-error: true
        run: python3 -I tools/seo_watch.py "$SITE_URL" seo-watch.md

      - name: Write summary
        if: always()
        run: |
          if [ -f seo-watch.md ]; then cp seo-watch.md summary.md; else echo "Sitemap checks did not produce a report." > summary.md; fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-watch-${{ github.run_id }}
          path: seo-watch.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Open, update or close tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.watch.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Safe to ignore: fails only when the label already exists.
          gh label create seo-watch --color 014296 --description "Scheduled SEO regression check" 2>/dev/null || true
          issue=$(gh issue list --label seo-watch --state open --json number --jq '.[0].number')
          { echo "Run: $RUN_URL"; echo; head -c 60000 summary.md; } > body.md
          if [ "$FAILED" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body-file body.md
            else
              gh issue create --label seo-watch --title "SEO watch: errors on $SITE_URL" --body-file body.md
            fi
            exit 1
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Clean run: $RUN_URL"
          fi
